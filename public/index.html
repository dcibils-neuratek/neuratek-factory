<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Neuratek Factory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Neuratek Factory's page, as drawn in `docs/factory.html` and agreed 24
   November 2026: a dense work tool in light and dark. A sidebar with the
   person's views and their projects; a project's agents at work across the
   top; the board with the card opened in a pane beside it. One file, no
   build step, over the API in `README.md`. */
:root {
  --ground: #f4f5f7; --panel: #ffffff; --sunk: #eceef2; --line: #dfe2e8; --line2: #cfd4dd;
  --ink: #161a22; --soft: #3d4452; --dim: #6b7383; --accent: #3550d6; --accent-ink: #ffffff; --accent-soft: #e6eafb;
  --amber: #b7660a; --amber-soft: #fdf0dc; --green: #1f8a4c; --green-soft: #e1f4e8; --red: #c23a3a; --red-soft: #fbe5e5;
  --violet: #6c4fd1; --violet-soft: #eee9fb;
  --c-ideas: #c9861b; --c-agreed: #7a5cdb; --c-next: #0f8a80; --c-building: #3550d6; --c-done: #1f8a4c; --c-parked: #b04fa0;
  --shadow: 0 1px 2px rgba(20, 26, 40, .06), 0 8px 24px rgba(20, 26, 40, .10);
  --scrim: rgba(10, 14, 22, .35);
  --body: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0e1116; --panel: #151a21; --sunk: #1b2129; --line: #252c36; --line2: #323b48;
    --ink: #e7ebf1; --soft: #c0c7d2; --dim: #8b94a3; --accent: #7d93ff; --accent-ink: #0b1030; --accent-soft: #1c2447;
    --amber: #f0b14e; --amber-soft: #2d2412; --green: #5fcf8c; --green-soft: #13281c; --red: #f07b7b; --red-soft: #2e1818;
    --violet: #a993ff; --violet-soft: #231c3d;
    --c-ideas: #f0b14e; --c-agreed: #a993ff; --c-next: #4fd0c3; --c-building: #7d93ff; --c-done: #5fcf8c; --c-parked: #e08fd2;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); --scrim: rgba(0, 0, 0, .55);
  }
}
:root[data-theme="dark"] {
  --ground: #0e1116; --panel: #151a21; --sunk: #1b2129; --line: #252c36; --line2: #323b48;
  --ink: #e7ebf1; --soft: #c0c7d2; --dim: #8b94a3; --accent: #7d93ff; --accent-ink: #0b1030; --accent-soft: #1c2447;
  --amber: #f0b14e; --amber-soft: #2d2412; --green: #5fcf8c; --green-soft: #13281c; --red: #f07b7b; --red-soft: #2e1818;
  --violet: #a993ff; --violet-soft: #231c3d;
  --c-ideas: #f0b14e; --c-agreed: #a993ff; --c-next: #4fd0c3; --c-building: #7d93ff; --c-done: #5fcf8c; --c-parked: #e08fd2;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); --scrim: rgba(0, 0, 0, .55);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--ground); color: var(--ink); font: 13.5px/1.45 var(--body); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.mono { font-family: var(--mono); }
.dim { color: var(--dim); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.btn { border: 1px solid var(--line2); background: var(--panel); border-radius: 7px; padding: 5px 11px; min-height: 30px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--dim); }
.btn.go { background: var(--accent); border-color: transparent; color: var(--accent-ink); font-weight: 500; }
.btn.quiet { border-color: transparent; background: transparent; color: var(--dim); }
.btn.done { background: var(--green-soft); border-color: transparent; color: var(--green); font-weight: 500; }
.btn:disabled { opacity: .45; cursor: default; }
.field { min-height: 32px; border-radius: 7px; border: 1px solid var(--line2); background: var(--panel); padding: 5px 9px; min-width: 0; }
textarea.field { resize: vertical; width: 100%; line-height: 1.45; }
.tag { font-size: 11px; padding: 0 6px; border-radius: 4px; background: var(--sunk); color: var(--soft); white-space: nowrap; line-height: 18px; }
.tag.you { background: var(--amber-soft); color: var(--amber); font-weight: 500; }
.tag.here { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.tag.ok { background: var(--green-soft); color: var(--green); }
.av { width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; font: 600 10px var(--body); color: #fff; flex: none; }
.av.s { width: 20px; height: 20px; font-size: 9px; }
.av.agent { background: var(--soft) !important; color: var(--panel); }
.avs { display: inline-flex; }
.avs .av { border: 2px solid var(--panel); margin-left: -6px; }
.avs .av:first-child { margin-left: 0; }
.pj { width: 18px; height: 18px; border-radius: 5px; display: inline-grid; place-items: center; font: 600 9.5px var(--mono); color: #fff; flex: none; }
.empty { color: var(--dim); padding: 18px; border: 1px dashed var(--line2); border-radius: 10px; margin: 0; }
.label { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--dim); font-weight: 500; }

/* the frame */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100dvh; }
.side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 1px; padding: 12px 10px; position: sticky; top: 0; height: 100dvh; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 9px; padding: 4px 8px 12px; font-weight: 700; letter-spacing: -.01em; }
.brand .mk { width: 24px; height: 24px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 700 13px var(--mono); }
.side .sec { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--dim); padding: 14px 8px 4px; display: flex; align-items: center; justify-content: space-between; }
.side .sec button { border: 0; background: none; color: var(--dim); padding: 0 4px; font-size: 15px; line-height: 1; }
.nav { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 7px; border: 0; background: none; text-align: left; width: 100%; color: var(--soft); min-height: 32px; }
.nav:hover { background: var(--sunk); }
.nav.on { background: var(--accent-soft); color: var(--ink); font-weight: 500; }
.nav .ic { width: 18px; text-align: center; color: var(--dim); flex: none; }
.nav .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav .n { margin-left: auto; font: 500 11px var(--mono); color: var(--dim); }
.nav .n.hot { color: #fff; background: var(--amber); border-radius: 999px; padding: 0 6px; }
.side .foot { margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 10px 6px 2px; border-top: 1px solid var(--line); }
.side .foot .who { min-width: 0; line-height: 1.25; }
.side .foot .who span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side .foot .acts { margin-left: auto; display: flex; }
.side .foot .acts button { border: 0; background: none; color: var(--dim); padding: 4px 6px; border-radius: 6px; }
.side .foot .acts button:hover { background: var(--sunk); color: var(--ink); }

.main { min-width: 0; display: flex; flex-direction: column; }
header.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 9px 18px; border-bottom: 1px solid var(--line); background: var(--panel); min-height: 52px; }
header.top h1 { margin: 0; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header.top .crumb { color: var(--dim); font-weight: 500; }
.menu { display: none; border: 1px solid var(--line2); background: var(--panel); border-radius: 7px; width: 32px; height: 32px; }
.search { margin-left: auto; display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--ground); border-radius: 7px; padding: 0 10px; color: var(--dim); width: min(300px, 40vw); min-height: 32px; }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; color: var(--ink); }
.search kbd { font: 11px var(--mono); border: 1px solid var(--line2); border-radius: 4px; padding: 0 4px; }
.spacer { margin-left: auto; }

/* the agents at work in a project, one line each */
.agents { display: flex; align-items: center; gap: 8px; padding: 8px 18px; border-bottom: 1px solid var(--line); background: var(--panel); overflow-x: auto; scrollbar-width: thin; }
.ag { display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 5px; border: 1px solid var(--line); border-radius: 8px; background: var(--ground); white-space: nowrap; font-size: 12.5px; }
.ag .st { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.ag.waiting { border-color: var(--amber); background: var(--amber-soft); }
.ag .on { border: 0; background: none; padding: 0; color: var(--ink); font-weight: 500; text-decoration: underline; text-decoration-color: var(--line2); text-underline-offset: 3px; }
.ag .stp { color: var(--soft); }
.agents::-webkit-scrollbar { height: 6px; }
.agents::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 3px; }
.agents .next { border: 0; background: none; color: var(--soft); font-size: 12.5px; padding: 4px 6px; white-space: nowrap; text-align: left; }
.agents .next b { font-weight: 500; color: var(--ink); }
.agents .feed { margin-left: auto; }
.today { border-bottom: 1px solid var(--line); background: var(--panel); padding: 6px 18px 10px; margin: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; }
.today li { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 10px; }
.today time { color: var(--dim); font-family: var(--mono); }

/* the board */
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 18px 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font-size: 12px; color: var(--soft); }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.chip .n { color: var(--dim); font: 500 11px var(--mono); }
.work { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 0; }
.work.open { grid-template-columns: minmax(0, 1fr) 380px; }
/* The board fits the window: each column scrolls its own cards, the columns
   scroll sideways under a bar that is always shown. --above is measured. */
.columns { min-width: 0; overflow-x: scroll; overflow-y: hidden; padding: 10px 18px 6px; height: calc(100dvh - var(--above, 160px)); min-height: 360px; scrollbar-color: var(--line2) transparent; }
.columns::-webkit-scrollbar { height: 12px; }
.columns::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 6px; border: 3px solid var(--ground); }
.cols { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(196px, 1fr); gap: 10px; height: 100%; }
.col { display: flex; flex-direction: column; min-height: 0; min-width: 0; border-radius: 10px; }
.col.over { background: var(--accent-soft); }
.colhead { display: flex; align-items: center; gap: 7px; padding: 2px 4px 8px; }
.colhead h2 { margin: 0; font-size: 12.5px; font-weight: 600; }
.colhead .n { color: var(--dim); font: 500 11.5px var(--mono); }
.colhead .hint { margin-left: auto; color: var(--dim); font-size: 11.5px; }
.list { flex: 1 1 auto; overflow-y: auto; min-height: 60px; display: flex; flex-direction: column; gap: 6px; padding: 0 2px 10px; scrollbar-width: thin; scrollbar-color: var(--line2) transparent; }
.cardbox { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 5px; text-align: left; width: 100%; touch-action: manipulation; user-select: none; -webkit-user-select: none; flex: none; }
.cardbox:hover { border-color: var(--line2); }
.cardbox.chosen { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.cardbox .title { font-weight: 500; line-height: 1.32; }
.cardbox .top, .cardbox .meta { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--dim); flex-wrap: wrap; }
.cardbox .ref { font-family: var(--mono); }
.cardbox .place { font: 500 10.5px var(--mono); color: var(--dim); }
.cardbox .meta .avs { margin-left: auto; }
.ghost { position: fixed; z-index: 100; pointer-events: none; transform: rotate(1.5deg); box-shadow: var(--shadow); opacity: .96; }
.placeholder { border: 2px dashed var(--accent); border-radius: 8px; flex: none; }
.more, .addcard { border: 0; background: transparent; color: var(--dim); text-align: left; padding: 5px 4px; font-size: 12.5px; flex: none; }
.more:hover, .addcard:hover { color: var(--ink); }

/* a card, opened */
.panel { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; overflow-y: auto; height: calc(100dvh - var(--above, 160px) + 10px); position: sticky; top: 0; }
.panel .hd { padding: 12px 16px 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.panel .hdrow { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); }
.panel .titlefield { font: 600 17px/1.3 var(--body); background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 2px 4px; margin: 0 -5px; width: calc(100% + 10px); }
.panel .titlefield:hover, .panel .titlefield:focus { border-color: var(--line2); }
.kv { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 6px 10px; font-size: 12.5px; align-items: center; margin: 0; }
.kv dt { color: var(--dim); }
.kv dd { margin: 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
.kv .field { min-height: 28px; padding: 3px 8px; }
.sect { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.quote { margin: 0; padding-left: 10px; border-left: 3px solid var(--accent); color: var(--dim); font-style: italic; }
.decide { border: 1px solid var(--amber); background: var(--amber-soft); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.decide .q { font-weight: 600; color: var(--amber); font-size: 12px; }
.decide .opts { display: flex; gap: 6px; flex-wrap: wrap; }
.thread { display: flex; flex-direction: column; gap: 10px; }
.msg { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 8px; font-size: 12.5px; }
.msg .by { color: var(--dim); font-size: 11.5px; }
.msg .b { line-height: 1.5; overflow-wrap: anywhere; white-space: pre-wrap; }
.msg .b .mention { color: var(--accent); font-weight: 500; }
.msg .asks { color: var(--amber); font-size: 11.5px; }
.files { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.file { display: flex; flex-direction: column; gap: 3px; border: 0; background: none; padding: 0; text-align: left; }
.file .thumb { height: 84px; border-radius: 7px; border: 1px solid var(--line); background: var(--sunk) center / cover no-repeat; display: grid; place-items: end start; padding: 5px 7px; font: 500 10.5px var(--mono); color: var(--dim); }
.file .cap { font-size: 12px; line-height: 1.35; }
.compose { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.history { font-size: 12px; color: var(--dim); display: flex; flex-direction: column; gap: 3px; }
.dropzone.over { outline: 2px dashed var(--accent); outline-offset: -6px; }

/* pages */
.page { padding: 18px; display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 1240px; }
.page.narrow { max-width: 860px; }
.page h2.h { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
.page h3.h { margin: 0; font-size: 14px; font-weight: 600; }
.lead { color: var(--soft); margin: 0; max-width: 72ch; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; align-items: start; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.box > h3 { margin: 0 0 2px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.box > h3 .n { margin-left: auto; font: 500 11.5px var(--mono); color: var(--dim); }
.item { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 12.5px; min-width: 0; }
.box > h3 + .item { border-top: 0; }
.item .tx { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.item button.tx { border: 0; background: none; padding: 0; text-align: left; color: var(--ink); }
.item button.tx:hover { text-decoration: underline; text-underline-offset: 3px; }
.item .r { margin-left: auto; display: flex; gap: 6px; align-items: center; flex: none; }
.wrapx { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table.t { width: 100%; min-width: 640px; border-collapse: collapse; background: var(--panel); font-size: 12.5px; }
table.t th { text-align: left; font-weight: 500; color: var(--dim); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 8px 12px; background: var(--sunk); }
table.t td { padding: 8px 12px; border-top: 1px solid var(--line); vertical-align: middle; }
.proj { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); }
.proj .open { border: 0; background: none; padding: 0; text-align: left; display: flex; align-items: center; gap: 10px; }
.proj .open h3 { margin: 0; font-size: 16px; font-weight: 600; }
.proj .open:hover h3 { text-decoration: underline; text-underline-offset: 3px; }
.counts { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.counts span { display: inline-flex; align-items: center; gap: 5px; }
.proj .doing { font-size: 12.5px; color: var(--soft); padding: 7px 10px; border-radius: 7px; background: var(--sunk); }
.qlist { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.qitem { display: grid; grid-template-columns: 22px 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; user-select: none; -webkit-user-select: none; }
.qitem .grip { color: var(--dim); cursor: grab; font-size: 16px; text-align: center; touch-action: none; }
.qitem .place { font: 500 13px var(--mono); color: var(--dim); text-align: center; }
.qitem .acts { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.nowcard { border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; background: var(--panel); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.split { display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); gap: 16px; align-items: start; }
.dlist { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ditem { display: flex; flex-direction: column; gap: 4px; width: 100%; padding: 10px 12px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); text-align: left; }
.ditem.chosen { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.dmain { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.opt { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.opt.rec { border-color: var(--accent); }
.opt.chosen { border-color: var(--green); box-shadow: 0 0 0 1px var(--green); }
.plus { color: var(--green); font-size: 12.5px; }
.minus { color: var(--red); font-size: 12.5px; }
.steps { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.step { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--panel); display: flex; flex-direction: column; gap: 5px; }
.step .k { font: 500 11px var(--mono); color: var(--accent); letter-spacing: .04em; }
.guide h3 { margin: 8px 0 0; font-size: 15px; }
.guide p, .guide li { color: var(--soft); max-width: 72ch; }
.guide ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
pre.cmd { margin: 0; font: 12px/1.5 var(--mono); background: var(--sunk); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; overflow-x: auto; color: var(--soft); }

/* sheets, the tour, toasts, the door */
.sheet { position: fixed; inset: 0; z-index: 60; background: var(--scrim); display: grid; place-items: center; padding: 16px; }
.sheet form { width: min(500px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.sheet h2 { margin: 0; font-size: 16px; }
.sheet label { display: grid; gap: 4px; font-size: 12px; color: var(--dim); }
.checks { display: flex; flex-direction: column; gap: 4px; max-height: 50vh; overflow-y: auto; }
.checks label { display: flex; align-items: center; gap: 8px; color: var(--ink); font-size: 13px; }
.tour { position: fixed; inset: 0; z-index: 70; background: var(--scrim); display: grid; place-items: center; padding: 16px; }
.tourcard { width: min(540px, 100%); background: var(--panel); border-radius: 14px; box-shadow: var(--shadow); border: 1px solid var(--line); overflow: hidden; }
.tourcard .body { padding: 18px 20px 14px; display: flex; flex-direction: column; gap: 8px; }
.tourcard h2 { margin: 0; font-size: 19px; text-wrap: balance; }
.tourcard p { margin: 0; color: var(--soft); line-height: 1.55; }
.tourcard .pic { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; padding: 16px 20px; background: var(--sunk); border-bottom: 1px solid var(--line); }
.tourcard .pic span { height: 20px; border-radius: 5px; background: var(--panel); border: 1px solid var(--line); }
.tourcard .pic span.hi { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.tourcard .foot { display: flex; align-items: center; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); }
.pips { display: flex; gap: 5px; }
.pips span { width: 18px; height: 4px; border-radius: 2px; background: var(--line2); }
.pips span.on { background: var(--accent); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--panel); border-radius: 8px; padding: 9px 14px; z-index: 80; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.gate { max-width: 420px; margin: 14vh auto; padding: 22px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; gap: 12px; }

@media (max-width: 1100px) {
  .work.open { grid-template-columns: minmax(0, 1fr); }
  .panel { position: fixed; inset: auto 0 0 0; height: auto; max-height: 82dvh; border: 1px solid var(--line); border-radius: 14px 14px 0 0; z-index: 40; box-shadow: var(--shadow); }
}
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; z-index: 50; left: 0; top: 0; width: 272px; transform: translateX(-100%); transition: transform .15s; box-shadow: var(--shadow); }
  .app.menuopen .side { transform: none; }
  .menu { display: inline-grid; place-items: center; }
  header.top { padding: 8px 16px; }
  .search { display: none; }
  .agents, .chips, .today { padding-left: 16px; padding-right: 16px; }
  .columns { padding: 10px 16px 6px; }
  .cols { grid-auto-columns: 78vw; }
  .page { padding: 16px; }
  .split { grid-template-columns: minmax(0, 1fr); }
  .qitem { grid-template-columns: 22px 24px minmax(0, 1fr); }
  .qitem .acts { grid-column: 1 / -1; justify-content: flex-start; }
}
@media (prefers-reduced-motion: reduce) { .side { transition: none; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

// ---- What this browser keeps ---------------------------------------------
// Conveniences only: a key for a device outside Google sign-in, the last
// project and view, the theme, whether the tour was seen.

const STORE = { key: "neuratek-factory-key", project: "neuratek-factory-project", view: "neuratek-factory-view",
                theme: "neuratek-factory-theme", toured: "neuratek-factory-toured" };
const kept = {
  get: (k) => { try { return localStorage.getItem(STORE[k]); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(STORE[k], v); } catch (e) {} },
  drop: (k) => { try { localStorage.removeItem(STORE[k]); } catch (e) {} },
};
let KEY = kept.get("key");
if (kept.get("theme")) document.documentElement.dataset.theme = kept.get("theme");

// ---- Talking to the API ----------------------------------------------------

// A project's own routes are under its name.
const P = () => "/api/p/" + encodeURIComponent(S.project);

async function api(path, opts = {}) {
  // Signed in through Access, the browser's cookie says who; a key is for a
  // device outside it. X-Factory is what lets a change through from a page.
  const headers = Object.assign(KEY ? { Authorization: "Bearer " + KEY } : {}, { "X-Factory": "1" }, opts.headers || {});
  let body = opts.body;
  if (body !== undefined && !(body instanceof Blob) && !(body instanceof ArrayBuffer)) {
    headers["Content-Type"] = "application/json";
    body = JSON.stringify(body);
  }
  const r = await fetch(path, { method: opts.method || "GET", headers, body });
  if (r.status === 401) { signOut(true); throw new Error("not signed in"); }
  const kind = r.headers.get("content-type") || "";
  const data = kind.includes("application/json") ? await r.json() : await r.blob();
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

function signOut(quietly) {
  const hadKey = !!KEY;
  KEY = null; S.me = null;
  kept.drop("key");
  if (!quietly && !hadKey) { location.href = "/cdn-cgi/access/logout"; return; }
  render();
}

// ---- What the page knows ---------------------------------------------------

const COLUMNS = [
  ["ideas", "Ideas", "asked, not agreed"], ["agreed", "Agreed", ""], ["next", "Next", "the queue"],
  ["building", "Building", "now"], ["done", "Done", ""], ["parked", "Parked", "held"],
];
const COLNAME = Object.fromEntries(COLUMNS.map(([k, n]) => [k, n]));
const STAGES = [["open", "Open", "var(--c-ideas)"], ["shaping", "Shaping", "var(--c-next)"], ["ready", "Ready", "var(--c-building)"], ["became", "Became cards", "var(--c-done)"], ["parked", "Parked", "var(--c-parked)"]];
const HUES = ["#3550d6", "#0f8a80", "#b04fa0", "#c9861b", "#6c4fd1", "#1f8a4c", "#c23a3a", "#2f7fb5", "#8a6d1f", "#5a6b8c"];
const PROJECT_VIEWS = ["board", "queue", "discussions", "decisions", "members"];

const S = {
  view: kept.get("view") || "board", project: kept.get("project") || "", me: null, projects: [], everywhere: null, mine: null,
  people: [], members: [], allNow: [], cards: [], queue: [], nows: [], now: null, discussions: [], decisions: [], waiting: null,
  today: [], area: "", query: "", chosen: null, detail: null, discussion: null, discussionDetail: null, stage: "",
  feedOpen: false, doneShown: 30, thumbs: {}, lastChange: null, tour: null, menu: false,
};

function hue(text) {
  let h = 0;
  for (const ch of text || "") h = (h * 31 + ch.charCodeAt(0)) % 997;
  return HUES[h % HUES.length];
}

function initials(name) {
  const w = (name || "?").replace(/\(.*\)/, "").trim().split(/\s+/);
  return ((w[0] || "?")[0] + (w.length > 1 ? w[w.length - 1][0] : "")).toUpperCase();
}

function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k === "style") n.setAttribute("style", v);
    else if (k === "value") n.value = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) n.append(k);
  return n;
}

const personOf = (id) => S.people.find((p) => p.id === id);
const nameOf = (id) => (personOf(id) || {}).name || "someone";
const projectOf = (id) => S.projects.find((p) => p.id === id);

// An avatar for a person, by id, or for whoever signed a change, by name.
function avatar(who, small) {
  const p = typeof who === "number" ? personOf(who) : null;
  const name = p ? p.name : who || "?";
  const agent = typeof who === "string" && /^(claude|gemini|codex|cursor|aider|agent)/i.test(who);
  return el("span", { class: "av" + (small ? " s" : "") + (agent ? " agent" : ""), style: "background:" + hue(name), title: name, text: agent ? name[0].toUpperCase() : initials(name) });
}

function projectMark(p) {
  return el("span", { class: "pj", style: "background:" + hue(p.id), text: initials(p.name) });
}

function when(iso) {
  if (!iso) return "";
  const d = new Date(iso), n = new Date();
  const hm = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  if (d.toDateString() === n.toDateString()) return hm;
  return d.toLocaleDateString([], { day: "numeric", month: "short" }) + ", " + hm;
}

function minutes(fromIso) {
  if (!fromIso) return "";
  const m = Math.max(0, Math.round((Date.now() - new Date(fromIso)) / 60000));
  return m < 60 ? m + " min" : Math.floor(m / 60) + " h " + (m % 60) + " min";
}

// Words with @handles shown as mentions.
function words(text) {
  const out = [];
  let last = 0;
  for (const m of text.matchAll(/(^|[^\w@])(@[a-z0-9._-]+)/gi)) {
    const at = m.index + m[1].length;
    out.push(text.slice(last, at), el("span", { class: "mention", text: m[2] }));
    last = at + m[2].length;
  }
  out.push(text.slice(last));
  return out;
}

let toastTimer = null;
function toast(text) {
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const t = el("div", { class: "toast", role: "status", text });
  document.body.append(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 3500);
}

async function attempt(what, fn) {
  try { return await fn(); } catch (e) { toast(what + ": " + e.message); try { await load(); } catch (err) {} render(); }
}

const myRole = () => !S.me ? null : S.me.admin ? "admin" : (S.me.roles || {})[S.project] || (projectOf(S.project) || {}).role || null;
const canWrite = () => myRole() === "admin" || myRole() === "member";

// ---- Loading ------------------------------------------------------------------

// Everything the person reaches first; then the chosen project's board.
async function load() {
  const [projects, everywhere, mine, people, allNow] = await Promise.all([
    api("/api/projects"), api("/api/waiting"), api("/api/mine"), api("/api/people"), api("/api/now"),
  ]);
  S.projects = projects.projects; S.everywhere = everywhere; S.mine = mine; S.people = people.people; S.allNow = allNow.now;
  if (!S.projects.some((p) => p.id === S.project)) S.project = S.projects.length ? S.projects[0].id : "";
  if (!S.project) {
    if (PROJECT_VIEWS.includes(S.view)) S.view = "projects";
    Object.assign(S, { cards: [], queue: [], nows: [], now: null, discussions: [], decisions: [], waiting: null, today: [], members: [] });
    return;
  }
  const midnight = new Date(); midnight.setHours(0, 0, 0, 0);
  const [cards, queue, now, discussions, decisions, waiting, today, members] = await Promise.all([
    api(P() + "/cards"), api(P() + "/queue"), api(P() + "/now"), api(P() + "/discussions"),
    api(P() + "/decisions"), api(P() + "/waiting"), api(P() + "/changes?since=" + midnight.toISOString()), api(P() + "/members"),
  ]);
  S.nows = now.now;
  S.now = S.nows.find((n) => n.state !== "idle" && n.person === S.me.person.id) || S.nows.find((n) => n.state !== "idle") || S.nows[0] || null;
  S.cards = cards.cards; S.queue = queue.queue; S.discussions = discussions.discussions;
  S.decisions = decisions.decisions; S.waiting = waiting; S.members = members.members;
  S.today = today.changes.filter((c) => c.kind !== "now").reverse().slice(0, 20);
  S.lastChange = today.now;
  if (S.chosen) S.detail = await api(P() + "/cards/" + encodeURIComponent(S.chosen)).catch(() => null);
  if (S.discussion) S.discussionDetail = await api(P() + "/discussions/" + S.discussion).catch(() => null);
}

// Every fifteen seconds, what changed anywhere the person reaches.
async function poll() {
  if (!S.me || document.hidden || dragging || document.querySelector(".sheet")) return;
  try {
    const c = await api("/api/changes?since=" + encodeURIComponent(S.lastChange || new Date().toISOString()));
    S.lastChange = c.now;
    if (c.changes.length) { await load(); render(); }
  } catch (e) {}
}
setInterval(poll, 15000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
window.addEventListener("resize", measure);

function measure() {
  const c = document.querySelector(".columns");
  if (c) document.documentElement.style.setProperty("--above", Math.round(c.getBoundingClientRect().top + window.scrollY) + "px");
}

// ---- The door ----------------------------------------------------------------------

function gate() {
  const input = el("input", { class: "field", id: "key", type: "password", autocomplete: "off", placeholder: "kb_…", "aria-label": "A key" });
  const said = el("p", { class: "dim", style: "margin:0;min-height:1.4em" });
  return el("form", { class: "gate", onsubmit: async (e) => {
    e.preventDefault();
    KEY = input.value.trim();
    try {
      S.me = await api("/api/me");
      kept.set("key", KEY);
      await load();
      if (!kept.get("toured")) { S.tour = 0; S.view = TOUR[0].view; }
      render();
    } catch (err) { said.textContent = "That key was not taken."; KEY = null; }
  } },
    el("div", { class: "brand", style: "padding:0" }, el("span", { class: "mk", text: "F" }), "Neuratek Factory"),
    el("p", { style: "margin:0", text: "You are not signed in. Reload the page to sign in with your Neuratek Google account; if it does not ask you, an admin has not let you in yet." }),
    el("p", { class: "dim", style: "margin:0", text: "On a device that cannot sign in that way, paste a key made for it with keys.py. It is kept in this browser only." }),
    input, said, el("button", { class: "btn go", type: "submit", text: "Open Factory" }));
}

// ---- The sidebar ---------------------------------------------------------------------

function go(view) {
  S.view = view; S.menu = false;
  kept.set("view", view);
  render();
}

function chooseProject(id, view) {
  S.project = id; S.chosen = null; S.detail = null; S.discussion = null; S.discussionDetail = null; S.area = ""; S.query = "";
  S.view = view || (PROJECT_VIEWS.includes(S.view) ? S.view : "board"); S.menu = false;
  kept.set("project", id); kept.set("view", S.view);
  return attempt("Not opened", async () => { await load(); render(); });
}

// Everything waiting on this person, in every project: their agents
// stopped for them, questions asked of them, threads where their agent
// asked, and where they were mentioned.
function owed() {
  const w = (S.everywhere && S.everywhere.person) || {};
  const out = [];
  for (const n of S.allNow.filter((x) => x.state === "waiting" && x.person === S.me.person.id)) {
    out.push({ kind: n.author + " waits", text: n.waiting || n.step || "waiting for you", project: n.project, go: () => openIn(n.project, n.card) });
  }
  for (const d of w.decisions || []) out.push({ kind: "Question", text: d.question, project: d.project, go: () => d.card ? openIn(d.project, d.card) : chooseProject(d.project, "decisions") });
  for (const c of w.cards || []) out.push({ kind: "Your agent asks", text: c.title, project: c.project, go: () => openIn(c.project, c.id) });
  for (const d of w.discussions || []) out.push({ kind: "Discussion", text: d.title, project: d.project, go: () => openDiscussionIn(d.project, d.id) });
  for (const m of w.mentions || []) out.push({ kind: "Mention", text: m.author + ": " + m.text, project: m.project, mention: m.id,
    go: () => m.card ? openIn(m.project, m.card) : openDiscussionIn(m.project, m.discussion) });
  return out;
}

function sidebar() {
  const nav = (view, icon, label, n, extra = {}) => el("button", { class: "nav" + ((extra.on ?? S.view === view) ? " on" : ""), type: "button", "data-view": view,
    onclick: extra.onclick || (() => go(view)) }, el("span", { class: "ic", "aria-hidden": "true", text: icon }), el("span", { class: "nm", text: label }),
    n ? el("span", { class: "n" + (extra.hot ? " hot" : ""), text: String(n) }) : null);
  const here = projectOf(S.project);
  const owedN = owed().length;
  const waitN = (p) => owed().filter((o) => o.project === p.id).length;
  const inProject = PROJECT_VIEWS.includes(S.view);
  return el("aside", { class: "side", "aria-label": "Views and projects" },
    el("div", { class: "brand" }, el("span", { class: "mk", text: "F" }), "Neuratek Factory"),
    nav("mine", "◎", "My work", owedN, { hot: owedN > 0 }),
    nav("projects", "≡", "All projects", S.projects.length),
    S.me.admin ? nav("people", "☺", "People", S.people.filter((p) => !p.removed).length) : null,
    nav("guide", "?", "How to use Factory"),
    el("div", { class: "sec" }, el("span", { text: "Projects" }), S.me.admin ? el("button", { type: "button", title: "New project", "aria-label": "New project", onclick: () => projectSheet() }, "+") : null),
    S.projects.map((p) => el("button", { class: "nav" + (p.id === S.project && inProject ? " on" : ""), type: "button", "data-project": p.id,
      onclick: () => chooseProject(p.id, inProject ? S.view : "board") }, projectMark(p), el("span", { class: "nm", text: p.name }),
      waitN(p) ? el("span", { class: "n hot", text: String(waitN(p)) }) : el("span", { class: "n", text: p.queued ? String(p.queued) : "" }))),
    S.projects.length ? null : el("p", { class: "dim", style: "padding:4px 8px;margin:0;font-size:12.5px", text: S.me.admin ? "No project yet." : "You are in no project yet. An admin adds you." }),
    here ? [
      el("div", { class: "sec" }, el("span", { text: here.name })),
      nav("board", "▦", "Board", S.cards.length),
      nav("queue", "↧", "Queue", upcoming().length),
      nav("discussions", "◌", "Discussions", S.discussions.filter((d) => d.stage !== "became" && d.stage !== "parked").length),
      nav("decisions", "◇", "Decisions", S.decisions.filter((d) => !d.answer).length),
      nav("members", "☷", "Members", S.members.length),
    ] : null,
    el("div", { class: "foot" }, avatar(S.me.person.id),
      el("span", { class: "who" }, el("span", { text: S.me.person.name }), el("span", { class: "dim", style: "font-size:11.5px", text: S.me.admin ? "Admin" : myRole() ? myRole()[0].toUpperCase() + myRole().slice(1) : "" })),
      el("span", { class: "acts" },
        el("button", { type: "button", title: "Light or dark", "aria-label": "Light or dark", onclick: flipTheme }, "◐"),
        el("button", { type: "button", title: "The API", "aria-label": "The API", onclick: () => go("api") }, "{}"),
        el("button", { type: "button", title: "Sign out", "aria-label": "Sign out", onclick: () => signOut(false) }, "⏻"))));
}

function flipTheme() {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
  kept.set("theme", r.dataset.theme);
}

// ---- The top bar and the agents at work -----------------------------------------------

function topbar() {
  const here = projectOf(S.project);
  const titles = { board: "Board", queue: "Queue", discussions: "Discussions", decisions: "Decisions", members: "Members",
                   mine: "My work", projects: "All projects", people: "People", guide: "How to use Factory", api: "The API" };
  const inProject = PROJECT_VIEWS.includes(S.view) && here;
  const search = S.view === "board" && here ? el("label", { class: "search" }, el("span", { "aria-hidden": "true", text: "⌕" }),
    el("input", { type: "search", value: S.query, placeholder: "Search cards", "aria-label": "Search cards", oninput: (e) => { S.query = e.target.value; renderMain(); } }),
    el("kbd", { text: "/" })) : el("span", { class: "spacer" });
  return el("header", { class: "top" },
    el("button", { class: "menu", type: "button", "aria-label": "Menu", onclick: () => { S.menu = !S.menu; document.querySelector(".app").classList.toggle("menuopen", S.menu); } }, "☰"),
    el("h1", {}, inProject ? el("span", { class: "crumb", text: here.name + " / " }) : null, inProject || !PROJECT_VIEWS.includes(S.view) ? titles[S.view] || "" : "All projects"),
    search,
    inProject && canWrite() ? el("button", { class: "btn go", type: "button", onclick: () => newCardSheet() }, "New card") : null,
    S.view === "projects" && S.me.admin ? el("button", { class: "btn go", type: "button", onclick: () => projectSheet() }, "New project") : null,
    S.view === "people" && S.me.admin ? el("button", { class: "btn go", type: "button", onclick: personSheet }, "Add someone") : null);
}

// The queue without the cards an agent has in hand: those are now, not next.
function upcoming() {
  const held = new Set(S.nows.filter((n) => n.state !== "idle" && n.card).map((n) => n.card));
  return S.queue.filter((q) => !q.card || !held.has(q.card));
}

function agentsBar() {
  const live = S.nows.filter((n) => n.state !== "idle" && (n.card || n.step));
  const ahead = upcoming();
  const line = (n) => el("span", { class: "ag" + (n.state === "waiting" ? " waiting" : ""), "data-author": n.author },
    avatar(n.author, true), el("span", { text: n.author }),
    el("span", { class: "st", style: "background:" + (n.state === "waiting" ? "var(--amber)" : "var(--green)") }),
    n.card ? el("button", { class: "on", type: "button", onclick: () => openCard(n.card) }, n.title || n.card) : el("span", { class: "on", text: n.step }),
    n.card && n.step ? el("span", { class: "stp", text: "· " + n.step }) : null,
    n.waiting ? el("span", { class: "stp", text: "· waiting on " + n.waiting }) : null,
    el("span", { class: "dim", text: minutes(n.since) }));
  return [
    el("section", { class: "agents", "aria-label": "Agents at work here" },
      live.length ? live.map(line) : el("span", { class: "dim", text: "No agent is working here now." }),
      ahead.length ? el("button", { class: "next", type: "button", onclick: () => go("queue") },
        el("span", { class: "dim", text: "Up next " }), el("b", { text: ahead[0].title }), ahead[1] ? ", then " + ahead[1].title : "",
        el("span", { class: "dim", text: " · " + ahead.length + " in the queue" })) : null,
      el("button", { class: "btn quiet feed", type: "button", "aria-expanded": String(S.feedOpen), onclick: () => { S.feedOpen = !S.feedOpen; renderMain(); } }, "Today")),
    S.feedOpen ? el("ol", { class: "today" }, S.today.length ? S.today.map((c) => el("li", {}, el("time", { text: when(c.at) }), el("span", {}, el("b", { style: "font-weight:500", text: c.author + " " }), sentence(c))))
      : el("li", {}, el("span"), el("span", { class: "dim", text: "Nothing yet today." }))) : null,
  ];
}

function titleOf(id) {
  const c = S.cards.find((x) => x.id === id);
  return c ? c.title : id;
}

function sentence(c) {
  const d = c.data || {};
  const t = c.card ? "“" + titleOf(c.card) + "”" : "";
  switch (c.kind) {
    case "card.new": return "made " + t;
    case "card.move": return "moved " + t + " to " + (COLNAME[d.to] || d.to);
    case "card.edit": return "changed " + t;
    case "card.remove": return "removed “" + (d.title || c.card) + "”";
    case "note": return (d.asks ? "asked on " : "wrote on ") + t + ": " + (d.text || "").slice(0, 120);
    case "file": return "added " + (d.name || "a file") + (t ? " to " + t : "") + (d.caption ? ": " + d.caption : "");
    case "queue.take": return "took " + (t || d.task || "the next task") + " from the queue";
    case "queue.add": return "queued " + (t || d.task || "a task");
    case "queue.remove": return "took " + (t || d.task || "a task") + " out of the queue";
    case "queue.move": return "reordered the queue";
    case "decision.new": return "asked " + (d.asks_of ? nameOf(d.asks_of) : "someone") + ": " + (d.question || "");
    case "decision.answer": return "decided: " + (d.answer || "");
    case "discussion.new": return "started a discussion: " + (d.title || "");
    case "discussion.edit": return "shaped a discussion";
    case "message": return "wrote in a discussion: " + (d.text || "").slice(0, 120);
    case "discussion.card": return "made " + t + " from a discussion";
    case "member": return "added " + (d.name || "someone") + " as a " + d.role;
    case "member.remove": return "took " + nameOf(d.person) + " out of the project";
    case "project.new": return "made the project";
    case "project.edit": return "changed the project";
    default: return c.kind;
  }
}

// A file's bytes come with who is asking, so a picture is fetched and shown

  if (!S.thumbs[f.id]) {
    try { S.thumbs[f.id] = URL.createObjectURL(await api("/api/files/" + f.id)); } catch (e) { return; }
  }
  node.style.backgroundImage = "url(" + S.thumbs[f.id] + ")";
  node.textContent = "";

async function openFile(f) {
  try {
    const url = S.thumbs[f.id] || URL.createObjectURL(await api("/api/files/" + f.id));
    S.thumbs[f.id] = url;
    window.open(url, "_blank", "noopener");
  } catch (e) { toast("Could not open it: " + e.message); }

async function upload(path, file) {
  if (file.size > 15 * 1024 * 1024) { toast(file.name + " is larger than 15 MB"); return; }
  await attempt("Not added", async () => {
    await api(path + "?name=" + encodeURIComponent(file.name) + "&caption=" + encodeURIComponent(file.name),
      { method: "POST", body: file, headers: { "Content-Type": file.type || "application/octet-stream" } });
    await load(); render(); toast("Added " + file.name);
  });
}

function dropFiles(node, take) {
  node.addEventListener("dragover", (e) => { if (e.dataTransfer && [...e.dataTransfer.types].includes("Files")) { e.preventDefault(); node.classList.add("over"); } });
  node.addEventListener("dragleave", () => node.classList.remove("over"));
  node.addEventListener("drop", (e) => { node.classList.remove("over"); if (e.dataTransfer && e.dataTransfer.files.length) { e.preventDefault(); [...e.dataTransfer.files].forEach(take); } });
}

// A pasted screenshot goes onto the open card or discussion.

  if (S.view === "board" && S.chosen) { e.preventDefault(); files.forEach((f) => upload(P() + "/cards/" + encodeURIComponent(S.chosen) + "/files", f)); }
  else if (S.view === "discussions" && S.discussion) { e.preventDefault(); files.forEach((f) => upload(P() + "/discussions/" + S.discussion + "/files", f)); }

function startDrag(e, node, kind) {
  const rect = node.getBoundingClientRect();
  const ghost = node.cloneNode(true);
  ghost.classList.add("ghost");

// ---- Drawing ----------------------------------------------------------------------------

function renderMain() {
  const main = document.getElementById("main");
  if (!main) return render();
  const scroll = document.querySelector(".columns");
  const left = scroll ? scroll.scrollLeft : 0;
  const tops = Object.fromEntries([...document.querySelectorAll(".col .list")].map((l) => [l.dataset.col, l.scrollTop]));
  const inProject = PROJECT_VIEWS.includes(S.view) && S.project;
  const view = !inProject && PROJECT_VIEWS.includes(S.view) ? overview()
    : S.view === "board" ? board() : S.view === "queue" ? [agentsBar(), queue()] : S.view === "discussions" ? discussions()
    : S.view === "decisions" ? decisions() : S.view === "members" ? members() : S.view === "mine" ? mine()
    : S.view === "people" && S.me.admin ? people() : S.view === "guide" ? guide() : S.view === "api" ? apiPage() : overview();
  main.replaceChildren(...[view].flat(Infinity).filter(Boolean));
  const again = document.querySelector(".columns");
  if (again) {
    again.scrollLeft = left;
    document.querySelectorAll(".col .list").forEach((l) => { l.scrollTop = tops[l.dataset.col] || 0; });
    measure();
  }
}

function render() {
  const app = document.getElementById("app");
  if (!S.me) { app.replaceChildren(gate()); return; }
  app.replaceChildren(el("div", { class: "app" + (S.menu ? " menuopen" : "") }, sidebar(), el("div", { class: "main" }, topbar(), el("div", { id: "main" }))),
    ...(S.tour !== null ? [tour()] : []));
  renderMain();
}
